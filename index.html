      // 1. Ensure window.fetch has both a getter and setter to prevent third-party scripts/wrappers from crashing
      (function() {
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = nativeFetch;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || nativeFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window) || Window.prototype;
            if (proto) {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return customFetch || nativeFetch; },
                set: function(fn) { customFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (_) {}
        }

        // 2. Intercept and suppress uncaught errors regarding fetch getter
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string' && (
            msg.indexOf('Cannot set property fetch') !== -1 ||
            msg.indexOf('fetch of #<Window>') !== -1 ||
            msg.indexOf('which has only a getter') !== -1
          )) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          var str = String(message || (error && error.message) || '');
          if (str.indexOf('fetch') !== -1 && (str.indexOf('getter') !== -1 || str.indexOf('Cannot set') !== -1)) {
            return true;
          }
          if (prevOnError) return prevOnError.apply(this, arguments);
        };
      })();

      // 3. Clean up and unregister any legacy or harmful service workers/caches
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function(err) {
          console.debug('SW unregister error:', err);
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        }).catch(function(err) {
